[project]
name = "speech-scorer"
version = "0.1.0"
description = "Score a timed speech transcript against its script: accuracy, skipped passages, pace and pauses."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["arabic-nlp-toolkit @ git+https://github.com/AmeesAnsari/arabic-nlp-toolkit@main"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
speech-scorer = "speech_scorer.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["speech_scorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
